name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The github-release reusable workflow requires `contents: write` to create the
# GitHub release. This repository's default workflow token permission is
# read-only, so without an explicit grant here GitHub rejects the workflow at
# load time (startup_failure). Declaring it explicitly makes the workflow start
# regardless of the repository's default token permission setting.
permissions:
  contents: write

jobs:
  build_test:
    uses: membraneframework/membrane_actions/.github/workflows/build-test.yml@main

  test:
    uses: membraneframework/membrane_actions/.github/workflows/test.yml@main

  lint:
    uses: membraneframework/membrane_actions/.github/workflows/lint.yml@main

  hex_publish:
    needs: [build_test, test, lint]
    uses: membraneframework/membrane_actions/.github/workflows/hex-publish.yml@main
    secrets:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  gh_release:
    needs: [hex_publish]
    uses: membraneframework/membrane_actions/.github/workflows/github-release.yml@main
